 <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Wydoraço IA</title>

    <link rel="stylesheet" href="css/login.css">
</head>
 <body>

<div class="particles"></div>

<div class="container">

    <div class="logo-area">

        <img
        src="wydoracoSemFundoPreto.png"
        class="logo"
        alt="Wydoraço IA">

        <h1 class="animated-title">
            Wydoraço IA
        </h1>

        <p class="subtitle">
            Plataforma inteligente para atendimento e vendas automáticas
        </p>

    </div>

    <form id="formLogin">

        <div class="input-box">

            <label>Email</label>

            <div class="input-field">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required>

            </div>

        </div>


        <div class="input-box">

            <label>Senha</label>

            <div class="input-field">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required>

                <i
                class="fa-solid fa-eye"
                id="togglePassword"></i>

            </div>

        </div>


        <button
        id="loginButton"
        type="submit">

            Entrar

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </form>


    <div class="links">

        <a href="cadastro.html">

            Criar conta

        </a>

        <span>|</span>

        <a href="recuperar.html">

            Esqueceu a senha?

        </a>

    </div>


    <div id="mensagem"></div>


    <div class="footer">

        © 2026 Wydoraço IA

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
